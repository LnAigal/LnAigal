name: Update Contribution Badges

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/generate_activity_graph.py'
      - '.github/workflows/update-badges.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Streak Stats
        run: |
          mkdir -p assets
          curl -sSfL --retry 3 -o assets/streak-stats.svg.tmp \
            "https://github-readme-streak-stats-eight-phi.vercel.app/?user=lnaigal&theme=tokyonight&hide_border=true&background=0d1117&stroke=00f7ff&ring=00f7ff&fire=00f7ff&currStreakLabel=00f7ff&sideLabels=ffffff&dates=ffffff&count_private=true"
          grep -q '<svg' assets/streak-stats.svg.tmp
          mv assets/streak-stats.svg.tmp assets/streak-stats.svg

      - name: Generate Activity Graph
        run: |
          python3 scripts/generate_activity_graph.py \
            --user lnaigal \
            --title "Lakshminarayana Aigal's Contribution Graph" \
            --days 31 \
            -o assets/activity-graph.svg.tmp
          grep -q '<svg' assets/activity-graph.svg.tmp
          mv assets/activity-graph.svg.tmp assets/activity-graph.svg

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --staged --quiet || (git commit -m "Update contribution badges [skip actions]" && git push)
